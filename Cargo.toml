[package]
name = "ovenauth"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rust-argon2 = "3.0"
anyhow = "1.0"
rand = { version = "0.10" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.49", features = ["full", "tracing"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
axum = { version = "0.8", features = ["tracing", "ws"] }
axum-login = "0.18"
thiserror = "2.0"
ulid = { version = "1.2", features = ["serde"] }
console-subscriber = "0.5"
tokio-stream = { version = "0.1", features = ["sync"] }

# upgrade to 0.15 as soon as axum-login is updated
tower-sessions = { version = "0.14", features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.14", features = ["postgres"] }
socketioxide = { version = "0.18" }

[dependencies.sqlx]
version = "0.8"
features = ["runtime-tokio-rustls", "json", "postgres" ]

